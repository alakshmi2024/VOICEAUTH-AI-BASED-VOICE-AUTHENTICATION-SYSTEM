{% extends "base.html" %}
{% block content %}

<div class="form-box">
  <h2>Registration</h2>
  <p>Record your voice sample for biometric authentication</p>

  <form method="POST" enctype="multipart/form-data" id="registerForm">

    <label>Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <h3>🎙 Voice Recording</h3>

    <button type="button" class="btn" onclick="startRecording()">Start Recording</button>
    <button type="button" class="btn btn-secondary" onclick="stopRecording()">Stop Recording</button>

    <audio id="audioPlayback" controls></audio>

    <input type="file" name="voice" id="voiceFile" hidden required>

    <button type="submit" class="btn">Register</button>
  </form>
</div>

{% endblock %}
